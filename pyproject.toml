[project]
name = "md-sync"
version = "0.1.0"
description = "LAN multi-device Markdown document sync"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "watchdog>=3.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["server*", "client*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
