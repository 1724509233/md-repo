# 服务端配置 (Win PC)
server:
  host: 0.0.0.0
  port: 9888
  vault_dir: ./vault

# 客户端配置 (Mac)
client:
  server_url: http://192.168.1.100:9888
  vault_dir: ./vault
  device_name: mac
  poll_interval: 300

# AI 配置 (可选)
ai:
  base_url: http://localhost:11434/v1
  api_key: ollama
  model: qwen2.5:14b
  max_tokens: 4096
  temperature: 0.7
