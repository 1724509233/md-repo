  #     context_window: 16384
  #     max_tokens: 4096
  #     temperature: 0.7
  #
  # ── 记忆运行时 v1：执行器角色（示例，取消注释启用）────────────────────
  # is_executor 全配置最多一个；它不起 LLM cron 任务——框架每 30 分钟跑一次
  # 确定性合并（adopted 提案落地 + 超期 awaiting_review 过期），无活 no-op。
  # target_dir 不受 LLM scope 限制（允许 vault 根 "."），不参与 scope 重叠校验。
