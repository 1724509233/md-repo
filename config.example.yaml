# 服务端配置 (Win PC)
server:
  host: 0.0.0.0
  port: 9888
  vault_dir: ./vault
  log_level: INFO  # 可选: DEBUG / INFO / WARNING / ERROR / CRITICAL（非法值启动报错）；DEBUG 含 watcher 事件/IO 细节
  log_dir: .sync/logs  # 日志目录，相对 vault_dir 或绝对路径，默认 .sync/logs
  log_retention_days: 30  # 清理超过 N 天的 .log（每日 3am）

# 客户端配置 (Mac)
client:
  server_url: http://192.168.1.100:9888
  vault_dir: ./vault
  device_name: mac
  poll_interval: 300

# AI 配置 (可选) — 支持 tool calling（agent 工具调用）
ai:
  base_url: "https://api.deepseek.com/v1"  # or http://localhost:11434/v1 for Ollama
  api_key: "your-api-key"
  model: "deepseek-chat"
  max_tokens: 4096
  context_window: 131072
  temperature: 0.7

# 后台定时 agent（可选）— 各自独立 cron / provider / prompt
# 启动时 fail-fast 校验：alias 唯一、cron 合法、prompt 文件存在、
# target_dir 在 vault 内且各 agent 互不重叠（共享面豁免：suggestions/ 提案区、index/ 机器区）
# v2 法律层（LLM 角色）：tools 必须显式声明（无 fail-open 默认）；tools 含 propose
# 必须配 verbs；propose 与 write_doc 不得同持（ADR-0004 分界线）。executor 角色豁免。
background_agents:
  - name: "笔记整理"
    alias: notes-organizer
    enabled: true
    cron: "0 3 * * *"                # 5 段标准 cron，server 时区
    target_dir: notes                 # 写操作 scope（vault 相对路径）
    prompt: server/prompts/notes-organizer.md   # 相对 config.yaml 所在目录
    report_dir: ""                    # 空 = <target_dir>/.reports/<alias>/
    max_rounds: 30
    timeout_s: 1800
    tools: [read_doc, search_docs, list_files, recent_changes,
            get_related_docs, recall_stats, write_doc]   # v2 法律层：必须显式声明
    model:                            # 独立 provider 配置（必填，不复用 ai 段）
      provider: openai
      model_id: qwen2.5:14b
      base_url: "http://localhost:11434/v1"
      api_key: ""
      context_window: 16384
      max_tokens: 4096
      temperature: 0.7

  # ── 记忆运行时 v2.2：固化者（示例，取消注释启用）─────────────────────────
  # 夜巡消化近期人类通道的碎片；唯一写动作 = propose 工具（零文件落：
  # suggestions/ 无投影文件、无账本行，v2a D25）。分界线：提案角色不持直写（ADR-0004）。
  # 预算是法律（这里），消耗记账在 .sync/index.db 的 trigger_state 表。
  # trigger：events ⊆ {create,update,delete,move}；arm_count/min_interval_h
  # 可缺省（默认 3 / 1.0h）。cron 保留为 deadline floor（无活则空转不烧 LLM）。
  # - name: "记忆固化"
  #   alias: consolidator
  #   enabled: true
  #   cron: "0 2 * * *"
  #   target_dir: index              # 写边界 = 机器区（propose 无文件落，此值为名义 scope）
  #   prompt: server/prompts/consolidator.md
  #   report_dir: .reports/consolidator
  #   max_rounds: 30
  #   timeout_s: 1800
  #   budget_runs_per_day: 3
  #   budget_max_proposals: 5
  #   tools: [read_doc, search_docs, list_files, recent_changes,
  #           get_related_docs, recall_stats, propose]   # 读×6 + propose；不持 write_doc（分界线）
  #   verbs: [entity_index, relatedness, summary, errata]   # propose 动词白名单（v2.2：v2a 配入 errata）
  #   trigger:
  #     events: [create]
  #     arm_count: 3
  #     min_interval_h: 6
