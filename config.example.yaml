#     api_key: ""

# 通知量级守卫（v2.2 债单 #6 / D33）：当日通知行数上限，超出折叠为单日摘要行。
# 同 alias 的 review 类通知（proposal_paths 相交）自动合并。
notifications:
  daily_cap: 20
