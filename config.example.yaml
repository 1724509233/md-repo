# ── 记忆运行时 v2.2：哨兵（示例，取消注释启用）─────────────────────────────
# 召回治理：旁路读取 recall 遥测（不经检索接口）、分桶判断，产**只读报告**
# （「N 篇 90 天未动，建议归档」——v2：archive 动词退役，自动化不搬用户区文件，
# 搬动 = 人在 Obsidian 拖）。报告通道（ADR-0004）：write_doc 写机器区
# index/reports/sentinel/YYYY-MM-DD.md；不产提案、不持 propose（分界线）。
# trigger.source: recall = 从召回账本武装（metric: failed_or_low = 失败查询
# + 低分命中计数，合成流量不计入）；cron 保留为每周心跳（复盘不靠自觉）。
# tools 白名单 = 行为维度授权（v2 法律层：必须显式声明，无 fail-open 默认）。
