# 周频纯 cron 心跳（无 trigger）：读 changelog + 近期情景，write_doc 产只读周报
# index/reports/narrator/YYYY-MM-DD.md（daily slot 幂等覆盖）。报告通道（ADR-0004）：
# 不产提案、不持 propose（reminder 动词退役；周期性问题 = 进周报待人处理）。
