<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>md-vault · AI 工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8'}}}}}
</script>

<script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>

<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 h-screen overflow-hidden antialiased">
<div class="flex h-screen">
<aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-[260px] bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col transform transition-transform duration-300 -translate-x-full lg:translate-x-0">
<div class="flex items-center gap-2.5 px-4 h-14 border-b border-gray-200 dark:border-gray-800 shrink-0">
<div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-bold text-sm">M</div>
<span class="font-semibold text-[15px]">md-vault</span>
<button id="sidebar-close" aria-label="关闭侧边栏" class="ml-auto text-gray-400 hover:text-gray-600 lg:hidden">✕</button>
</div>
<div class="px-3 pt-3 pb-2 shrink-0">
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-3"><svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></span>
<input id="search-input" type="text" class="w-full pl-9 pr-3 py-2 text-sm border border-gray-300 dark:border-gray-700 rounded-lg bg-gray-50 dark:bg-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="搜索文档…">
</div>
</div>
<nav id="file-tree" class="flex-1 overflow-y-auto scroll-thin px-2 pb-4 space-y-0.5 text-sm">
<div class="text-gray-400 text-xs px-2 py-3 text-center">加载中…</div>
</nav>
</aside>
<div id="overlay" class="fixed inset-0 bg-black/30 z-30 hidden"></div>
<div class="flex-1 flex overflow-hidden relative">
<main id="main-area" class="flex-1 flex flex-col overflow-hidden transition-[padding] duration-350">
<div class="flex items-center gap-3 px-4 h-14 border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 shrink-0">
<button id="hamburger" aria-label="打开侧边栏" class="lg:hidden text-gray-500 hover:text-gray-700">☰</button>
<span id="current-file" class="font-medium text-sm flex-1 truncate">未选择文档</span>
<div class="flex rounded-lg overflow-hidden border border-gray-300 dark:border-gray-700 text-xs">
<button id="btn-edit" class="px-3 py-1.5 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700">✏️ 编辑</button>
<button id="btn-preview" class="px-3 py-1.5 bg-blue-600 text-white font-medium">👁 预览</button>
</div>
<button id="btn-download" class="text-xs px-3 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800">↓ 下载</button>
<button id="btn-save" class="text-xs px-3 py-1.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700">保存</button>
<button id="theme-toggle" aria-label="切换深色/浅色模式" class="text-xs px-2.5 py-1.5 border border-gray-300 dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800">🌙</button>
</div>
<div class="flex-1 overflow-y-auto p-4 md:p-6">
<div class="max-w-[720px] mx-auto min-h-full">
<textarea id="editor" class="hidden w-full min-h-full border-0 bg-transparent resize-none focus:outline-none font-mono text-sm leading-relaxed" placeholder="从左侧选择一个文档..."></textarea>
<div id="preview" class="w-full min-h-full"></div>
</div>
</div>
</main>
<button id="ai-btn" aria-label="打开/关闭 AI 助手" class="shrink-0 w-8 h-16 self-center my-auto bg-gray-100 dark:bg-gray-800 border border-r-0 border-gray-200 dark:border-gray-700 rounded-l-lg hover:bg-blue-50 dark:hover:bg-gray-700 transition-colors flex items-center justify-center text-gray-400 dark:text-gray-500 hover:text-blue-600 dark:hover:text-blue-400 relative z-20">
<svg id="ai-chevron" class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>
</button>
<div id="ai-panel" class="bg-white dark:bg-gray-900 border-l border-gray-200 dark:border-gray-700 flex flex-col">
<div class="flex items-center gap-3 px-4 py-3 border-b border-gray-200 dark:border-gray-800 shrink-0">
<div class="w-9 h-9 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white">🤖</div>
<div class="flex-1"><div class="font-semibold text-sm">AI 助手</div><div id="ai-status" class="text-xs text-gray-400">就绪</div></div>
<span id="ai-mode" class="text-xs px-2.5 py-1 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-md cursor-pointer font-medium">当前文档</span>
<button id="ai-close" aria-label="关闭 AI 助手" class="text-gray-400 hover:text-gray-600">✕</button>
</div>
<div id="ai-messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
<div class="p-3 border-t border-gray-200 dark:border-gray-800 shrink-0">
<div class="flex items-end gap-2 bg-gray-100 dark:bg-gray-800 rounded-xl p-3 focus-within:ring-2 focus-within:ring-blue-500/40">
<textarea id="ai-input" rows="1" class="flex-1 border-0 bg-transparent resize-none focus:outline-none text-sm" placeholder="输入消息，Enter 发送..."></textarea>
<button id="ai-send" aria-label="发送消息" class="w-9 h-9 rounded-full bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shrink-0">↑</button>
</div>
</div>
</div>
</div>
</div>
<script>
(function(){
var currentPath=null;
var previewMode=true;
var btnEdit=document.getElementById('btn-edit'),btnPrev=document.getElementById('btn-preview');
var editor=document.getElementById('editor'),preview=document.getElementById('preview');
var treeEl=document.getElementById('file-tree');

/* ---------- marked renderer (Tailwind classes) ---------- */
var renderer=new marked.Renderer();
renderer.heading=function(text,level){return '<h'+level+' class="font-bold text-gray-900 dark:text-gray-100 mt-6 mb-3 '+(level===1?'text-2xl border-b border-gray-200 dark:border-gray-700 pb-2':level===2?'text-xl':level===3?'text-lg':'text-base')+'">'+text+'</h'+level+'>'};
renderer.list=function(body,ordered,start){var tag=ordered?'ol':'ul';return '<'+tag+' class="'+(ordered?'list-decimal':'list-disc')+' pl-5 space-y-1.5 my-3 text-gray-700 dark:text-gray-300">'+body+'</'+tag+'>'};
renderer.listitem=function(text){return '<li class="leading-relaxed">'+text+'</li>'};
renderer.code=function(code,lang){var cls=lang?' class="language-'+lang+'"':'';return '<pre class="bg-gray-900 dark:bg-gray-800 text-gray-100 rounded-lg p-4 my-3 overflow-x-auto text-sm"><code'+cls+'>'+code+'</code></pre>'};
renderer.blockquote=function(quote){return '<blockquote class="border-l-4 border-blue-500 pl-4 my-3 text-gray-600 dark:text-gray-400 italic">'+quote+'</blockquote>'};
renderer.table=function(header,body){return '<div class="overflow-x-auto my-3"><table class="w-full text-sm border-collapse"><thead><tr>'+header+'</tr></thead><tbody>'+body+'</tbody></table></div>'};
renderer.tablerow=function(content){return '<tr class="border-b border-gray-200 dark:border-gray-700">'+content+'</tr>'};
renderer.tablecell=function(content,header){var tag=header?'th':'td';return '<'+tag+' class="'+(header?'bg-gray-50 dark:bg-gray-800 font-semibold text-left':'')+' px-3 py-2 border border-gray-200 dark:border-gray-700">'+content+'</'+tag+'>'};
renderer.paragraph=function(text){return '<p class="my-3 leading-relaxed text-gray-700 dark:text-gray-300">'+text+'</p>'};
renderer.strong=function(text){return '<strong class="font-semibold text-gray-900 dark:text-gray-100">'+text+'</strong>'};
renderer.em=function(text){return '<em class="italic">'+text+'</em>'};
renderer.codespan=function(text){return '<code class="bg-gray-100 dark:bg-gray-800 text-blue-600 dark:text-blue-400 px-1.5 py-0.5 rounded text-xs font-mono">'+text+'</code>'};
renderer.hr=function(){return '<hr class="my-6 border-gray-200 dark:border-gray-700">'};
renderer.link=function(href,text){return '<a href="'+href+'" class="text-blue-600 dark:text-blue-400 underline hover:no-underline">'+text+'</a>'};
marked.setOptions({renderer:renderer});

/* ---------- preview rendering (DOMPurify + highlight + mermaid) ---------- */
function renderPreview(){
  var raw=marked.parse(editor.value);
  preview.innerHTML=window.DOMPurify?DOMPurify.sanitize(raw):raw;
  preview.querySelectorAll('pre code').forEach(function(el){if(window.hljs)hljs.highlightElement(el)});
  var mermaidBlocks=preview.querySelectorAll('pre code.language-mermaid');
  if(mermaidBlocks.length&&window.mermaid){
    mermaidBlocks.forEach(function(block){
      var div=document.createElement('div');
      div.className='mermaid';
      div.textContent=block.textContent;
      block.parentElement.replaceWith(div);
    });
    mermaid.run({nodes:preview.querySelectorAll('.mermaid')});
  }
}

/* ---------- file tree (recursive) ---------- */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function buildTree(files){
  var root={dirs:{},files:[]};
  files.forEach(function(f){
    var parts=f.path.split('/');
    var node=root;
    for(var i=0;i<parts.length-1;i++){
      if(!node.dirs[parts[i]])node.dirs[parts[i]]={dirs:{},files:[]};
      node=node.dirs[parts[i]];
    }
    var name=parts[parts.length-1];
    if(name.toLowerCase().endsWith('.md'))name=name.slice(0,-3);
    node.files.push({path:f.path,name:name});
  });
  function renderNode(node,depth){
    var html='';
    var dirNames=Object.keys(node.dirs).sort();
    dirNames.forEach(function(dn){
      var child=node.dirs[dn];
      var count=0;
      (function c(n){n.files.forEach(function(){count++});Object.keys(n.dirs).forEach(function(k){c(n.dirs[k])})})(child);
      html+='<div class="tree-group open">';
      html+='<button class="tree-row w-full flex items-center gap-1.5 px-2 py-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 text-left">';
      html+='<svg class="chev w-3.5 h-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg>';
      html+='<span>📁</span><span class="font-medium">'+esc(dn)+'</span><span class="ml-auto text-xs text-gray-400 bg-gray-100 dark:bg-gray-800 rounded-full px-2 py-0.5">'+count+'</span>';
      html+='</button>';
      html+='<div class="tree-children ml-2 pl-1.5 border-l border-gray-200 dark:border-gray-800 space-y-0.5 py-0.5">';
      html+=renderNode(child,depth+1);
      html+='</div></div>';
    });
    node.files.sort(function(a,b){return a.name<b.name?-1:1}).forEach(function(it){
      html+='<button class="tree-file w-full text-left px-2 py-1.5 rounded-md hover:bg-blue-50 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300" data-path="'+esc(it.path)+'">'+esc(it.name)+'</button>';
    });
    return html;
  }
  return renderNode(root,0);
}
async function loadDocs(){
  try{
    var res=await fetch('/api/docs');
    var files=await res.json();
    treeEl.innerHTML=buildTree(files);
    treeEl.querySelectorAll('.tree-row').forEach(function(btn){
      btn.addEventListener('click',function(){
        var g=btn.closest('.tree-group');
        if(!g)return;
        g.classList.toggle('open');
        var c=g.querySelector(':scope > .tree-children');
        if(c)c.classList.toggle('hidden');
      });
    });
    treeEl.querySelectorAll('.tree-file').forEach(function(btn){
      btn.addEventListener('click',function(){
        treeEl.querySelectorAll('.tree-file.active').forEach(function(el){el.classList.remove('active','bg-blue-100','dark:bg-gray-700','text-blue-600')});
        btn.classList.add('active','bg-blue-100','dark:bg-gray-700','text-blue-600');
        openDoc(btn.dataset.path);
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('overlay').classList.add('hidden');
      });
    });
  }catch(e){treeEl.innerHTML='<div class="text-red-400 text-xs px-2 py-3">加载失败: '+esc(e.message)+'</div>'}
}

/* ---------- doc load / save ---------- */
async function openDoc(path){
  currentPath=path;
  document.getElementById('current-file').textContent=path;
  try{
    var res=await fetch('/api/docs/'+encodeURIComponent(path));
    editor.value=await res.text();
    if(previewMode)renderPreview();
  }catch(e){editor.value='加载失败: '+e.message}
}
async function saveDoc(){
  if(!currentPath)return;
  try{
    var res=await fetch('/api/docs/'+encodeURIComponent(currentPath),{method:'PUT',headers:{'Content-Type':'text/plain'},body:editor.value});
    if(res.ok){document.getElementById('btn-save').textContent='✓ 已保存';setTimeout(function(){document.getElementById('btn-save').textContent='保存'},1500)}
    else{alert('保存失败: '+res.status)}
  }catch(e){alert('保存失败: '+e.message)}
}

/* ---------- edit / preview toggle ---------- */
function setMode(mode){
  if(mode==='edit'){
    btnEdit.className='px-3 py-1.5 bg-blue-600 text-white font-medium';
    btnPrev.className='px-3 py-1.5 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700';
    editor.classList.remove('hidden');preview.classList.add('hidden');
    previewMode=false;
  }else{
    btnPrev.className='px-3 py-1.5 bg-blue-600 text-white font-medium';
    btnEdit.className='px-3 py-1.5 bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700';
    renderPreview();
    editor.classList.add('hidden');preview.classList.remove('hidden');
    previewMode=true;
  }
}
btnEdit.addEventListener('click',function(){setMode('edit')});
btnPrev.addEventListener('click',function(){setMode('preview')});
document.getElementById('btn-save').addEventListener('click',saveDoc);
document.getElementById('btn-download').addEventListener('click',function(){
  if(!currentPath)return;
  var blob=new Blob([editor.value],{type:'text/markdown'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=currentPath.split('/').pop();a.click();URL.revokeObjectURL(a.href);
});

/* ---------- sidebar mobile ---------- */
document.getElementById('hamburger').addEventListener('click',function(){document.getElementById('sidebar').classList.remove('-translate-x-full');document.getElementById('overlay').classList.remove('hidden')});
document.getElementById('sidebar-close').addEventListener('click',function(){document.getElementById('sidebar').classList.add('-translate-x-full');document.getElementById('overlay').classList.add('hidden')});
document.getElementById('overlay').addEventListener('click',function(){document.getElementById('sidebar').classList.add('-translate-x-full');this.classList.add('hidden')});

/* ---------- search filter ---------- */
document.getElementById('search-input').addEventListener('input',function(){
  var q=this.value.toLowerCase();
  treeEl.querySelectorAll('.tree-file').forEach(function(el){el.style.display=!q||el.textContent.toLowerCase().indexOf(q)>=0?'':'none'});
});

/* ---------- theme ---------- */
function applyTheme(dark){document.getElementById('hljs-light').disabled=dark;document.getElementById('hljs-dark').disabled=!dark}
document.getElementById('theme-toggle').addEventListener('click',function(){
  var h=document.documentElement;var d=h.classList.contains('dark');
  h.classList.toggle('dark');applyTheme(!d);
  this.textContent=d?'🌙':'☀️';
});
applyTheme(document.documentElement.classList.contains('dark'));

/* ---------- AI chat (SSE streaming) ---------- */
var aiBtn=document.getElementById('ai-btn'),aiPanel=document.getElementById('ai-panel');
var mainArea=document.getElementById('main-area');
var aiChevron=document.getElementById('ai-chevron');
function toggleAI(open){
  aiPanel.classList.toggle('open',open);
  mainArea.style.paddingRight=open?'40%':'0';
  aiChevron.style.transform=open?'rotate(180deg)':'';
  if(open){aiBtn.classList.add('bg-blue-50','dark:bg-blue-900/30','border-blue-200','dark:border-blue-800','text-blue-600','dark:text-blue-400')}
  else{aiBtn.classList.remove('bg-blue-50','dark:bg-blue-900/30','border-blue-200','dark:border-blue-800','text-blue-600','dark:text-blue-400')}
}
aiBtn.addEventListener('click',function(){toggleAI(!aiPanel.classList.contains('open'))});
document.getElementById('ai-close').addEventListener('click',function(){toggleAI(false)});
var aiMode='当前文档';
var sessionId = 'web-' + Date.now();
document.getElementById('ai-mode').addEventListener('click',function(){
  aiMode=aiMode==='当前文档'?'全库搜索':'当前文档';
  this.textContent=aiMode;
});
function addMsg(role,text){
  var m=document.getElementById('ai-messages');
  var d=document.createElement('div');
  d.className='msg-in flex gap-2 '+(role==='user'?'justify-end':'');
  if(role==='ai'){var av=document.createElement('div');av.className='w-7 h-7 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white text-xs shrink-0';av.textContent='🤖';d.appendChild(av)}
  var b=document.createElement('div');
  if(role==='user'){b.className='max-w-[80%] px-3.5 py-2.5 rounded-2xl rounded-br-md bg-blue-600 text-white text-sm'}
  else{b.className='max-w-[80%] px-3.5 py-2.5 rounded-2xl rounded-bl-md bg-gray-100 dark:bg-gray-800 text-sm'}
  b.textContent=text;d.appendChild(b);m.appendChild(d);m.scrollTop=m.scrollHeight;return b;
}
async function ragSearch(query){
  var res=await fetch('/api/ai/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:query,top_k:5})});
  return res.json();
}
async function sendChat(){
  var inp=document.getElementById('ai-input');
  var text=inp.value.trim();
  if(!text)return;
  inp.value='';
  addMsg('user',text);
  document.getElementById('ai-status').textContent='思考中...';
  var bubble=addMsg('ai','');
  bubble.classList.add('stream-cursor');
  try{
    var body={message:text,session_id:sessionId,doc_path:currentPath};
    if(aiMode==='全库搜索'){
      var results=await ragSearch(text);
      body.context=(results||[]).map(function(r){return '【'+r.path+'】\n'+(r.snippet||'')}).join('\n\n');
    }
    var resp=await fetch('/api/agent/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!resp.ok){bubble.textContent='错误: '+resp.status;document.getElementById('ai-status').textContent='就绪';bubble.classList.remove('stream-cursor');return}
    var reader=resp.body.getReader();
    var decoder=new TextDecoder();
    var buffer='';
    while(true){
      var chunk=await reader.read();
      if(chunk.done)break;
      buffer+=decoder.decode(chunk.value,{stream:true});
      var lines=buffer.split('\n');
      buffer=lines.pop();
      for(var i=0;i<lines.length;i++){
        var line=lines[i].trim();
        if(line.startsWith('data: ')){
          try{
            var evt=JSON.parse(line.slice(6));
            switch(evt.type){
              case 'token':
                bubble.textContent+=evt.text;
                break;
              case 'tool_call':
                insertToolCard(evt.id,evt.name,evt.args,'pending');
                break;
              case 'confirm_request':
                updateToolCard(evt.id,'confirm',evt.args);
                break;
              case 'tool_result':
                updateToolCard(evt.id,evt.rejected?'rejected':(evt.error?'error':'done'),evt.result);
                break;
              case 'done':
                finishStream();
                enableInput();
                break;
            }
          }catch(e){}
        }
      }
      document.getElementById('ai-messages').scrollTop=1e9;
    }
  }catch(e){bubble.textContent='请求失败: '+e.message}
  bubble.classList.remove('stream-cursor');
  document.getElementById('ai-status').textContent='就绪';
}
var toolCardNames = {
    read_doc: '📖 读取文档',
    search_docs: '🔍 搜索文档',
    list_files: '📁 列出文件',
    write_doc: '✏️ 写入文档',
    delete_doc: '🗑 删除文档',
    move_doc: '📦 移动文档'
};
function insertToolCard(id, name, args, status) {
    var chat = document.getElementById('ai-messages');
    var card = document.createElement('div');
    card.id = 'tool-' + id;
    card.className = 'tool-card tool-' + status;
    var label = toolCardNames[name] || name;
    var pathArg = args.path || args.from_path || '';
    card.innerHTML =
        '<div class="tool-header">' +
        '<span class="tool-icon">⏳</span>' +
        '<span class="tool-label">' + label + '</span>' +
        (pathArg ? '<code class="tool-path">' + pathArg + '</code>' : '') +
        '</div>';
    chat.appendChild(card);
    chat.scrollTop = chat.scrollHeight;
}
function updateToolCard(id, status, result) {
    var card = document.getElementById('tool-' + id);
    if (!card) return;
    card.className = 'tool-card tool-' + status;
    var icon = card.querySelector('.tool-icon');
    if (status === 'done') {
        icon.textContent = '✓';
        icon.className = 'tool-icon text-green-600';
    } else if (status === 'confirm') {
        icon.textContent = '⚠';
        icon.className = 'tool-icon text-amber-600';
        // Add confirm/cancel buttons
        var btns = document.createElement('div');
        btns.className = 'tool-buttons flex gap-2 mt-2';
        btns.innerHTML =
            '<button onclick="sendConfirm(\'' + id + '\',true)" class="text-xs px-3 py-1 bg-blue-600 text-white rounded hover:bg-blue-700">✓ 确认</button>' +
            '<button onclick="sendConfirm(\'' + id + '\',false)" class="text-xs px-3 py-1 border rounded hover:bg-gray-50">✕ 取消</button>';
        card.appendChild(btns);
    } else if (status === 'rejected' || status === 'error') {
        icon.textContent = '✕';
        icon.className = 'tool-icon text-red-600';
    }
    if (result) {
        var detail = document.createElement('div');
        detail.className = 'tool-detail text-xs text-gray-500 mt-1 truncate';
        detail.textContent = result;
        card.appendChild(detail);
    }
}
function sendConfirm(id, approved) {
    fetch('/api/agent/confirm', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id: id, approved: approved, session_id: sessionId})
    });
    // Update card to show waiting state
    var card = document.getElementById('tool-' + id);
    if (card) {
        var btns = card.querySelector('.tool-buttons');
        if (btns) btns.innerHTML = '<span class="text-xs text-gray-400">等待处理...</span>';
    }
}
function finishStream(){
  var bubble=document.querySelector('.stream-cursor');
  if(bubble)bubble.classList.remove('stream-cursor');
}
function enableInput(){
  document.getElementById('ai-status').textContent='就绪';
}
document.getElementById('ai-send').addEventListener('click',sendChat);
document.getElementById('ai-input').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});
