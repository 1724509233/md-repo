<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- theme-color 为 style.css :root --paper 的字面量抄本（meta 无法引用 CSS 变量，改 token 须同步此处） -->
  <meta name="theme-color" content="#F4EFE6">
  <!-- Inter 400 latin 主字体面预载（首屏正文）；latin-ext 后到，不参与首屏，不预载 -->
  <link rel="preload" href="/static/vendor/fonts/Inter-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <title>md-vault · AI 工作台</title>
  <script src="/static/vendor/js/tailwind.js"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { bg: 'var(--paper)', surface: 'var(--surface)', border: 'var(--line)', text: 'var(--ink)', muted: 'var(--ink-soft)' }, fontFamily: { sans: ['Inter', '-apple-system', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'], mono: ['JetBrains Mono', 'ui-monospace', 'monospace'] } } } }
  </script>
  <link rel="stylesheet" href="/static/vendor/css/fonts.css">
  <link rel="stylesheet" href="/static/vendor/css/flowbite.min.css">
  <script src="/static/vendor/js/flowbite.min.js"></script>
  <script src="/static/vendor/js/marked.min.js"></script>
  <script src="/static/vendor/js/purify.min.js"></script>
  <script src="/static/vendor/js/mermaid.min.js"></script>
  <script src="/static/vendor/js/highlight.min.js"></script>
  <script src="/static/vendor/js/vue.global.prod.js"></script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/style-softlink.css">
</head>

<body class="bg-bg text-text h-full overflow-hidden antialiased font-sans">
  <div id="app"></div>
  <script type="module">
    import { createApp } from '/static/js/app.js'
    createApp().mount('#app')
  </script>
</body>

</html>
